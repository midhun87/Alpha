<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test History - AWSPrepZone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom right, #e0f2f7, #c1e4f4);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem;
        }
        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            padding: 2rem;
            max-width: 800px;
            width: 100%;
            margin-top: 2rem;
        }
        .question-item {
            border-bottom: 1px solid #eee;
            padding: 1rem 0;
        }
        .question-item:last-child {
            border-bottom: none;
        }
        .correct-answer {
            color: #16a34a; /* Tailwind green-600 */
            font-weight: 500;
        }
        .incorrect-answer {
            color: #dc2626; /* Tailwind red-600 */
            font-weight: 500;
        }
        .loading-message {
            text-align: center;
            font-size: 1.1rem;
            color: #4a5568;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-3xl font-bold text-center text-blue-800 mb-6">Test History Details</h2>
        <div id="loadingMessage" class="loading-message">Loading test history...</div>
        <div id="historyDetails" class="mt-6">
            </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', fetchTestHistory);

        async function fetchTestHistory() {
            const urlParams = new URLSearchParams(window.location.search);
            const testResultId = urlParams.get('testResultId');
            const userId = urlParams.get('userId'); // Get the userId from the URL

            const historyDetailsDiv = document.getElementById('historyDetails');
            const loadingMessage = document.getElementById('loadingMessage');

            if (!testResultId || !userId) {
                loadingMessage.textContent = 'Error: Missing user ID or test result ID in URL.';
                return;
            }

            loadingMessage.textContent = `Loading history for User ID: ${userId}, Test ID: ${testResultId}...`;

            try {
                const response = await fetch(`/get-test-history-by-id?userId=${userId}&testResultId=${testResultId}`);
                const data = await response.json();

                if (response.ok) {
                    loadingMessage.style.display = 'none';
                    renderTestHistory(data);
                } else {
                    console.error('Failed to fetch test history:', data.message);
                    loadingMessage.textContent = `Error: ${data.message || 'Failed to load test history.'}`;
                }
            } catch (error) {
                console.error('Network or server error fetching test history:', error);
                loadingMessage.textContent = 'Network error. Could not load test history. Please check your connection.';
            }
        }

        function renderTestHistory(historyData) {
            const historyDetailsDiv = document.getElementById('historyDetails');
            historyDetailsDiv.innerHTML = ''; // Clear loading message

            // We will now assume if historyData exists, we should try to render it.
            // You can add a more specific check here if needed (e.g., if historyData.TestAttemptId is null).
            if (!historyData) {
                historyDetailsDiv.innerHTML = '<p class="text-center text-red-600">Error: Received no data for this test history.</p>';
                return;
            }

            // Display overall test details using the correct field names from your DynamoDB item
            historyDetailsDiv.innerHTML += `
                <h3 class="text-2xl font-semibold text-blue-700 mb-4">${historyData.ModuleTested || 'Test Details'}</h3>
                <p><strong>Date:</strong> ${new Date(historyData.AttemptDate).toLocaleDateString()}</p>
                <p><strong>Module:</strong> ${historyData.ModuleTested || 'N/A'}</p>
                <p><strong>Score:</strong> <span class="${historyData.IsPass ? 'text-green-600' : 'text-red-600'}">${historyData.Score || 0} / ${historyData.TotalQuestions || 0}</span></p>
                <p><strong>Username:</strong> ${historyData.UserLoginUsername || 'N/A'}</p>
                <p class="text-gray-700 text-lg mt-6"><strong>Questions & Answers:</strong></p>
            `;

            // Display individual question details
            // Your current DynamoDB item does NOT contain a 'questions' array.
            // Therefore, this section will always show 'No question-level details available'.
            // If you need question-level details, you must store them in your TestAttempts table,
            // perhaps as a complex attribute (list of maps) or fetch from another table.
            if (historyData.questions && historyData.questions.length > 0) {
                historyData.questions.forEach((q, index) => {
                    historyDetailsDiv.innerHTML += `
                        <div class="question-item">
                            <p class="font-semibold text-gray-800">Q${index + 1}: ${q.questionText}</p>
                            <p class="text-sm text-gray-600 ml-4">Your Answer: <span class="${q.isCorrect ? 'correct-answer' : 'incorrect-answer'}">${q.studentAnswer || 'Not answered'}</span></p>
                            <p class="text-sm text-gray-600 ml-4">Correct Answer: <span class="correct-answer">${q.correctAnswer}</span></p>
                            ${q.explanation ? `<p class="text-xs text-gray-500 ml-4">Explanation: ${q.explanation}</p>` : ''}
                        </div>
                    `;
                });
            } else {
                historyDetailsDiv.innerHTML += '<p class="text-center text-gray-500 mt-4">No question-level details available for this test.</p>';
            }
        }

        function formatDuration(seconds) {
            if (seconds < 60) return `${seconds} seconds`;
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            if (remainingSeconds === 0) return `${minutes} minutes`;
            return `${minutes} minutes ${remainingSeconds} seconds`;
        }
    </script>
</body>
</html>
