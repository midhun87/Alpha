<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWSPrepZone Admin Dashboard</title>
    <link rel="stylesheet" href="style.css"> <style>
        /* Basic styling for demonstration */
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; background-color: #f9f9f9; }
        .filters label { display: block; margin-bottom: 5px; font-weight: bold; }
        .filters select, .filters input[type="date"], .filters button {
            width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;
        }
        .filters button { background-color: #007bff; color: white; border: none; cursor: pointer; transition: background-color 0.3s ease; }
        .filters button:hover { background-color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .message { margin-top: 20px; padding: 10px; background-color: #e0f7fa; border: 1px solid #b2ebf2; border-radius: 4px; }
        .error { background-color: #ffebee; border: 1px solid #ef9a9a; color: #d32f2f; }
        .tab-buttons { display: flex; margin-bottom: 15px; }
        .tab-button { padding: 10px 15px; border: 1px solid #ccc; border-bottom: none; background-color: #eee; cursor: pointer; margin-right: 5px; border-radius: 5px 5px 0 0; }
        .tab-button.active { background-color: #007bff; color: white; border-color: #007bff; }
        .tab-content { border: 1px solid #ccc; padding: 20px; border-radius: 0 5px 5px 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Dashboard</h1>

        <div class="message" id="message"></div>

        <div class="tab-buttons">
            <button class="tab-button active" data-tab="testResults">Test Results</button>
            <button class="tab-button" data-tab="violations">Violations</button>
            <button class="tab-button" data-tab="learningProgress">Learning Progress</button>
        </div>

        <div id="testResultsTab" class="tab-content">
            <h2>Test Results Overview</h2>
            <div class="filters">
                <div>
                    <label for="collegeFilterTest">College Name:</label>
                    <select id="collegeFilterTest"></select>
                </div>
                <div>
                    <label for="moduleFilterTest">Module Tested:</label>
                    <select id="moduleFilterTest">
                        <option value="">All Modules</option>
                        <option value="Module 1">Module 1</option>
                        <option value="Module 2">Module 2</option>
                        <option value="Module 3">Module 3</option>
                        <option value="Module 4">Module 4</option>
                        <option value="Module 5">Module 5</option>
                        <option value="Module 6">Module 6</option>
                        <option value="Module 7">Module 7</option>
                        <option value="Module 8">Module 8</option>
                        <option value="Module 9">Module 9</option>
                        <option value="Module 10">Module 10</option>
                        <option value="Module 11">Module 11</option>
                        <option value="Module 12">Module 12</option>
                        <option value="Module 13">Module 13</option>
                        <option value="Module 14">Module 14</option>
                        <option value="All Modules">All Modules</option>
                    </select>
                </div>
                <div>
                    <label for="startDateFilterTest">Start Date:</label>
                    <input type="date" id="startDateFilterTest">
                </div>
                <div>
                    <label for="endDateFilterTest">End Date:</label>
                    <input type="date" id="endDateFilterTest">
                </div>
                <div>
                    <button onclick="fetchTestAttempts()">Apply Filters</button>
                </div>
            </div>
            <table id="testAttemptsTable">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>College</th>
                        <th>Module</th>
                        <th>Score</th>
                        <th>Total Qs</th>
                        <th>Pass/Fail</th>
                        <th>Attempt Date</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>

        <div id="violationsTab" class="tab-content" style="display:none;">
            <h2>Violations Log</h2>
            <div class="filters">
                <div>
                    <label for="collegeFilterViolation">College Name:</label>
                    <select id="collegeFilterViolation"></select>
                </div>
                <div>
                    <label for="moduleFilterViolation">Module:</label>
                    <select id="moduleFilterViolation">
                        <option value="">All Modules</option>
                        <option value="Module 1">Module 1</option>
                        <option value="Module 2">Module 2</option>
                        <option value="Module 3">Module 3</option>
                        <option value="Module 4">Module 4</option>
                        <option value="Module 5">Module 5</option>
                        <option value="Module 6">Module 6</option>
                        <option value="Module 7">Module 7</option>
                        <option value="Module 8">Module 8</option>
                        <option value="Module 9">Module 9</option>
                        <option value="Module 10">Module 10</option>
                        <option value="Module 11">Module 11</option>
                        <option value="Module 12">Module 12</option>
                        <option value="Module 13">Module 13</option>
                        <option value="Module 14">Module 14</option>
                        <option value="All Modules">All Modules</option>
                    </select>
                </div>
                <div>
                    <label for="violationTypeFilter">Violation Type:</label>
                    <select id="violationTypeFilter"></select>
                </div>
                <div>
                    <label for="startDateFilterViolation">Start Date:</label>
                    <input type="date" id="startDateFilterViolation">
                </div>
                <div>
                    <label for="endDateFilterViolation">End Date:</label>
                    <input type="date" id="endDateFilterViolation">
                </div>
                <div>
                    <button onclick="fetchViolations()">Apply Filters</button>
                </div>
            </div>
            <table id="violationsTable">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>College</th>
                        <th>Module</th>
                        <th>Type</th>
                        <th>Timestamp</th>
                        <th>Question Index</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>

        <div id="learningProgressTab" class="tab-content" style="display:none;">
            <h2>Learning Progress Overview</h2>
            <div class="filters">
                <div>
                    <label for="collegeFilterProgress">College Name:</label>
                    <select id="collegeFilterProgress"></select>
                </div>
                <div>
                    <button onclick="fetchLearningProgress()">Apply Filters</button>
                </div>
            </div>
            <table id="learningProgressTable">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>College</th>
                        <th>Topic Number</th>
                        <th>Completed At</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>

    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5000'; // Or your deployed backend URL

        document.addEventListener('DOMContentLoaded', () => {
            // Check for admin token on page load
            const token = localStorage.getItem('jwtToken');
            const isAdmin = localStorage.getItem('isAdmin') === 'true'; // Assuming you store isAdmin on login

            if (!token || !isAdmin) {
                alert('Access Denied: You must be logged in as an administrator to view this page.');
                window.location.href = '/login.html'; // Redirect to login page
                return;
            }

            // Initial fetches
            fetchUniqueColleges('collegeFilterTest');
            fetchUniqueColleges('collegeFilterViolation');
            fetchUniqueColleges('collegeFilterProgress');
            fetchUniqueViolationTypes();
            fetchTestAttempts(); // Load initial data
            setupTabNavigation();
        });

        function setupTabNavigation() {
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabContents = document.querySelectorAll('.tab-content');

            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const targetTab = button.dataset.tab;

                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');

                    tabContents.forEach(content => {
                        content.style.display = 'none';
                    });
                    document.getElementById(targetTab + 'Tab').style.display = 'block';

                    // Trigger data fetch for the newly active tab
                    if (targetTab === 'testResults') fetchTestAttempts();
                    if (targetTab === 'violations') fetchViolations();
                    if (targetTab === 'learningProgress') fetchLearningProgress();
                });
            });
        }

        function getAuthHeaders() {
            const token = localStorage.getItem('jwtToken');
            return {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            };
        }

        function showMessage(msg, isError = false) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = msg;
            messageDiv.className = 'message';
            if (isError) {
                messageDiv.classList.add('error');
            }
            messageDiv.style.display = 'block';
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000); // Hide after 5 seconds
        }

        async function fetchUniqueColleges(selectId) {
            try {
                const response = await fetch(`${API_BASE_URL}/admin/unique-colleges`, {
                    headers: getAuthHeaders()
                });
                if (!response.ok) {
                    if (response.status === 403) {
                        throw new Error('Access Denied: Not authorized as admin.');
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                const selectElement = document.getElementById(selectId);
                selectElement.innerHTML = '<option value="">All Colleges</option>'; // Default option
                data.colleges.forEach(college => {
                    const option = document.createElement('option');
                    option.value = college;
                    option.textContent = college;
                    selectElement.appendChild(option);
                });
            } catch (error) {
                console.error('Error fetching unique colleges:', error);
                showMessage(`Error loading colleges: ${error.message}`, true);
            }
        }

        async function fetchUniqueViolationTypes() {
            try {
                const response = await fetch(`${API_BASE_URL}/admin/unique-violation-types`, {
                    headers: getAuthHeaders()
                });
                if (!response.ok) {
                    if (response.status === 403) {
                        throw new Error('Access Denied: Not authorized as admin.');
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                const selectElement = document.getElementById('violationTypeFilter');
                selectElement.innerHTML = '<option value="">All Types</option>'; // Default option
                data.violationTypes.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type;
                    selectElement.appendChild(option);
                });
            } catch (error) {
                console.error('Error fetching unique violation types:', error);
                showMessage(`Error loading violation types: ${error.message}`, true);
            }
        }

        async function fetchTestAttempts() {
            const college = document.getElementById('collegeFilterTest').value;
            const module = document.getElementById('moduleFilterTest').value;
            const startDate = document.getElementById('startDateFilterTest').value;
            const endDate = document.getElementById('endDateFilterTest').value;

            const queryParams = new URLSearchParams();
            if (college) queryParams.append('college', college);
            if (module) queryParams.append('module', module);
            if (startDate) queryParams.append('startDate', startDate);
            if (endDate) queryParams.append('endDate', endDate);

            try {
                const response = await fetch(`${API_BASE_URL}/admin/test-attempts?${queryParams.toString()}`, {
                    headers: getAuthHeaders()
                });
                if (!response.ok) {
                    if (response.status === 403) {
                        throw new Error('Access Denied: Not authorized as admin.');
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                renderTestAttempts(data.attempts);
            } catch (error) {
                console.error('Error fetching test attempts:', error);
                showMessage(`Error loading test attempts: ${error.message}`, true);
                document.getElementById('testAttemptsTable').getElementsByTagName('tbody')[0].innerHTML = '<tr><td colspan="7">Error loading data.</td></tr>';
            }
        }

        function renderTestAttempts(attempts) {
            const tbody = document.getElementById('testAttemptsTable').getElementsByTagName('tbody')[0];
            tbody.innerHTML = ''; // Clear previous results

            if (attempts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7">No test attempts found for the selected filters.</td></tr>';
                return;
            }

            attempts.forEach(attempt => {
                const row = tbody.insertRow();
                row.insertCell().textContent = attempt.UserLoginUsername || 'N/A';
                row.insertCell().textContent = attempt.CollegeName || 'N/A';
                row.insertCell().textContent = attempt.ModuleTested;
                row.insertCell().textContent = `${attempt.Score}`;
                row.insertCell().textContent = `${attempt.TotalQuestions}`;
                row.insertCell().textContent = attempt.IsPass ? 'Passed' : 'Failed';
                row.insertCell().textContent = new Date(attempt.AttemptDate).toLocaleString();
            });
        }

        async function fetchViolations() {
            const college = document.getElementById('collegeFilterViolation').value;
            const module = document.getElementById('moduleFilterViolation').value;
            const violationType = document.getElementById('violationTypeFilter').value;
            const startDate = document.getElementById('startDateFilterViolation').value;
            const endDate = document.getElementById('endDateFilterViolation').value;

            const queryParams = new URLSearchParams();
            if (college) queryParams.append('college', college);
            if (module) queryParams.append('module', module);
            if (violationType) queryParams.append('violationType', violationType);
            if (startDate) queryParams.append('startDate', startDate);
            if (endDate) queryParams.append('endDate', endDate);

            try {
                const response = await fetch(`${API_BASE_URL}/admin/violations?${queryParams.toString()}`, {
                    headers: getAuthHeaders()
                });
                if (!response.ok) {
                     if (response.status === 403) {
                        throw new Error('Access Denied: Not authorized as admin.');
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                renderViolations(data.violations);
            } catch (error) {
                console.error('Error fetching violations:', error);
                showMessage(`Error loading violations: ${error.message}`, true);
                document.getElementById('violationsTable').getElementsByTagName('tbody')[0].innerHTML = '<tr><td colspan="6">Error loading data.</td></tr>';
            }
        }

        function renderViolations(violations) {
            const tbody = document.getElementById('violationsTable').getElementsByTagName('tbody')[0];
            tbody.innerHTML = ''; // Clear previous results

            if (violations.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">No violations found for the selected filters.</td></tr>';
                return;
            }

            violations.forEach(violation => {
                const row = tbody.insertRow();
                row.insertCell().textContent = violation.UserLoginUsername || 'N/A';
                row.insertCell().textContent = violation.CollegeName || 'N/A';
                row.insertCell().textContent = violation.Module;
                row.insertCell().textContent = violation.ViolationType;
                row.insertCell().textContent = new Date(violation.Timestamp).toLocaleString();
                row.insertCell().textContent = violation.QuestionIndex;
            });
        }

        async function fetchLearningProgress() {
            const college = document.getElementById('collegeFilterProgress').value;

            const queryParams = new URLSearchParams();
            if (college) queryParams.append('college', college);

            try {
                const response = await fetch(`${API_BASE_URL}/admin/learning-progress?${queryParams.toString()}`, {
                    headers: getAuthHeaders()
                });
                if (!response.ok) {
                     if (response.status === 403) {
                        throw new Error('Access Denied: Not authorized as admin.');
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                renderLearningProgress(data.learningProgress);
            } catch (error) {
                console.error('Error fetching learning progress:', error);
                showMessage(`Error loading learning progress: ${error.message}`, true);
                document.getElementById('learningProgressTable').getElementsByTagName('tbody')[0].innerHTML = '<tr><td colspan="4">Error loading data.</td></tr>';
            }
        }

        function renderLearningProgress(progressData) {
            const tbody = document.getElementById('learningProgressTable').getElementsByTagName('tbody')[0];
            tbody.innerHTML = ''; // Clear previous results

            if (progressData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">No learning progress found for the selected filters.</td></tr>';
                return;
            }

            progressData.forEach(progress => {
                const row = tbody.insertRow();
                // Assuming you've populated UserLoginUsername and CollegeName in the backend for convenience
                row.insertCell().textContent = progress.UserLoginUsername || 'N/A'; // Backend currently only returns UserId, need to map if you want username here
                row.insertCell().textContent = progress.CollegeName || 'N/A';
                row.insertCell().textContent = progress.TopicNumber;
                row.insertCell().textContent = new Date(progress.CompletedAt).toLocaleString();
            });
        }

        // Add this new endpoint to your backend.js file, for example, after other admin-related endpoints or test-related endpoints.

    </script>
</body>
</html>
